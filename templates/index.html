<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Print Farm Control</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <h1>Print Farm Control</h1>

  <section class="job-panel">
  <input id="file-input" type="file" style="display:none" />
  <button id="choose-file-btn">Выбрать файл...</button>
  <span id="chosen-file-name" style="margin-left:8px; font-size:0.9rem; color:#555;">
    Файл не выбран
  </span>

  <button id="start-btn" style="margin-left:16px;">
    Запустить печать на выбранных
  </button>

  <div id="status" class="status"></div>
</section>


  <section class="grid-panel">
    <h2>Карта принтеров</h2>
    <div id="grid"></div>
  </section>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
